<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fafaf9;
        color: #1c1917;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 2px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #166534;
      }
      p.sub {
        margin: 0 0 12px;
        font-size: 11px;
        color: #78716c;
      }
      label {
        display: block;
        font-size: 11px;
        color: #57534e;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 3px;
        padding: 7px 9px;
        border: 1px solid #e7e5e4;
        border-radius: 7px;
        background: #fff;
        font: inherit;
      }
      input:focus {
        outline: 2px solid rgba(22, 101, 52, 0.3);
        border-color: #166534;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row label {
        flex: 1;
      }
      button {
        width: 100%;
        margin-top: 6px;
        padding: 9px;
        border: none;
        border-radius: 8px;
        background: #166534;
        color: #fff;
        font: 600 13px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: #166534;
        border: 1px solid #d6d3d1;
      }
      #status {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #fff;
        border: 1px solid #e7e5e4;
        font-size: 11px;
        color: #44403c;
        min-height: 14px;
      }
      #status.ok {
        border-color: rgba(22, 101, 52, 0.4);
        color: #166534;
      }
      #status.err {
        border-color: rgba(153, 27, 27, 0.4);
        color: #991b1b;
      }
      .note {
        margin-top: 10px;
        font-size: 10px;
        color: #a8a29e;
      }
    </style>
  </head>
  <body>
    <h1>DotMatch</h1>
    <p class="sub">Apply assistant — fills forms, never submits them.</p>

    <label>
      DotMatch API base URL
      <input id="apiBase" type="text" placeholder="http://localhost:8001" />
    </label>
    <label>
      Full name (used for name fields)
      <input id="name" type="text" placeholder="Ruth Tadesse" />
    </label>
    <div class="row">
      <label>
        Email
        <input id="email" type="email" placeholder="you@example.com" />
      </label>
      <label>
        Phone
        <input id="phone" type="tel" placeholder="+251 ..." />
      </label>
    </div>
    <label>
      City / location
      <input id="city" type="text" placeholder="Addis Ababa" />
    </label>
    <div class="row">
      <label>
        LinkedIn URL
        <input id="linkedin" type="text" placeholder="https://linkedin.com/in/…" />
      </label>
      <label>
        GitHub URL
        <input id="github" type="text" placeholder="https://github.com/…" />
      </label>
    </div>
    <label>
      Portfolio URL
      <input id="portfolio" type="text" placeholder="https://…" />
    </label>

    <button id="save" type="button">Save</button>
    <button id="test" type="button" class="secondary">Check resume connection</button>

    <div id="status">Checking…</div>
    <p class="note">
      Data stays in local extension storage on this device (never synced to your browser
      profile) and is only sent to the API URL above (your own DotMatch backend).
    </p>

    <script src="popup.js"></script>
  </body>
</html>
