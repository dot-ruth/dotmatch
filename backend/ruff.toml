line-length = 120
target-version = "py312"
extend-exclude = [".ruff_cache", "__pycache__", "data"]

[lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "SIM",
]
ignore = [
    # FastAPI: `File(...)` / `Depends(...)` in parameter defaults is the documented idiom.
    "B008",
    # Long conditionals read better as if/else blocks than as nested ternaries.
    "SIM108",
]
